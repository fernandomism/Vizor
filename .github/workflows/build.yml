name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Self-test
        run: swiftc Sources/Gaze.swift Tests/main.swift -o "$RUNNER_TEMP/vizor-selftest" && "$RUNNER_TEMP/vizor-selftest"

      # TEMPORARY: proves the signing path with a throwaway certificate made here. Removed once it passes.
      - name: Signing self-check
        run: |
          cd "$RUNNER_TEMP"
          cat > cert.cnf <<'EOF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = Vizor Signing
          [ext]
          basicConstraints = critical, CA:false
          keyUsage = critical, digitalSignature
          extendedKeyUsage = critical, codeSigning
          EOF
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 2 -config cert.cnf -keyout key.pem -out cert.pem
          /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem -name "Vizor Signing" -passout pass:test -out test.p12
          SIGNING_CERT_P12="$(base64 -i test.p12)" SIGNING_CERT_PASSWORD=test sh "$GITHUB_WORKSPACE/tools/import-signing-cert.sh"
          rm key.pem test.p12

      - name: Signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: sh tools/import-signing-cert.sh

      - name: Build
        run: ./build.sh

      - name: Check signature
        run: |
          codesign --verify --strict --verbose=2 build/Vizor.app
          requirement=$(codesign -d -r- build/Vizor.app 2>&1 | grep designated)
          echo "$requirement"
          if [ -n "$SIGN_IDENTITY" ] && echo "$requirement" | grep -q cdhash; then
            echo "::error::A signing certificate is set up but the app was signed ad-hoc"
            exit 1
          fi

      # Zip with ditto: it keeps the executable bit and code signature, which upload-artifact alone drops.
      - name: Package
        run: ditto -c -k --keepParent build/Vizor.app build/Vizor.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Vizor
          path: build/Vizor.zip
